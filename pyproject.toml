[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diloger"
version = "0.1.0"
description = "Local macOS trainer for spoken and written dialogue practice"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
diloger = "diloger.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diloger = ["qml/*.qml", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
